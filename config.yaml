  ZW:  {name: Wheat,             yahoo: "ZW=F",  point_value: 50,       proxy: WEAT, margin_pct: 7, group: commodity, cot: "001602", exchange: CBT, months: HKNUZ}
  KE:  {name: KC Wheat,          yahoo: "KE=F",  point_value: 50,                    margin_pct: 7, group: commodity, cot: "001612", exchange: CBT, months: HKNUZ}
  ZL:  {name: Soybean Oil,       yahoo: "ZL=F",  point_value: 600,                   margin_pct: 6, group: commodity, cot: "007601", exchange: CBT, months: FHKNQUVZ}
  ZM:  {name: Soybean Meal,      yahoo: "ZM=F",  point_value: 100,                   margin_pct: 6, group: commodity, cot: "026603", exchange: CBT, months: FHKNQUVZ}
  LE:  {name: Live Cattle,       yahoo: "LE=F",  point_value: 400,                   margin_pct: 4, group: commodity, cot: "057642", exchange: CME, months: GJMQVZ}
  HE:  {name: Lean Hogs,         yahoo: "HE=F",  point_value: 400,                   margin_pct: 6, group: commodity, cot: "054642", exchange: CME, months: GJKMNQVZ}
  GF:  {name: Feeder Cattle,     yahoo: "GF=F",  point_value: 500,                   margin_pct: 4, group: commodity, cot: "061641", exchange: CME, months: FHJKQUVX}
