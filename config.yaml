# The market table. This is reference data, not tuning: parameters live at the top of run.py.
#   yahoo:       front-month continuous price symbol
#   point_value: dollars per 1.00 move in the quoted price (VERIFY against CME contract specs)
#   proxy:       ETF whose options stand in for options on the future (omit if none)
#   exchange:    Yahoo suffix for individual contract months (e.g. CLZ26.NYM)
#   months:      contract months listed (F=Jan G=Feb H=Mar J=Apr K=May M=Jun N=Jul Q=Aug U=Sep V=Oct X=Nov Z=Dec)
markets:
  # Equity indices
  ES:  {name: S&P 500,           yahoo: "ES=F",  point_value: 50,       proxy: SPY,  exchange: CME, months: HMUZ}
  NQ:  {name: Nasdaq 100,        yahoo: "NQ=F",  point_value: 20,       proxy: QQQ,  exchange: CME, months: HMUZ}
  RTY: {name: Russell 2000,      yahoo: "RTY=F", point_value: 50,       proxy: IWM,  exchange: CME, months: HMUZ}
  YM:  {name: Dow Jones,         yahoo: "YM=F",  point_value: 5,        proxy: DIA,  exchange: CBT, months: HMUZ}
  # Interest rates
  ZT:  {name: 2-Year Note,       yahoo: "ZT=F",  point_value: 2000,     proxy: SHY,  exchange: CBT, months: HMUZ}
  ZF:  {name: 5-Year Note,       yahoo: "ZF=F",  point_value: 1000,     proxy: IEI,  exchange: CBT, months: HMUZ}
  ZN:  {name: 10-Year Note,      yahoo: "ZN=F",  point_value: 1000,     proxy: IEF,  exchange: CBT, months: HMUZ}
  ZB:  {name: 30-Year Bond,      yahoo: "ZB=F",  point_value: 1000,     proxy: TLT,  exchange: CBT, months: HMUZ}
  UB:  {name: Ultra Bond,        yahoo: "UB=F",  point_value: 1000,     proxy: TLT,  exchange: CBT, months: HMUZ}
  # Energy
  CL:  {name: Crude Oil,         yahoo: "CL=F",  point_value: 1000,     proxy: USO,  exchange: NYM, months: FGHJKMNQUVXZ}
  NG:  {name: Natural Gas,       yahoo: "NG=F",  point_value: 10000,    proxy: UNG,  exchange: NYM, months: FGHJKMNQUVXZ}
  RB:  {name: Gasoline,          yahoo: "RB=F",  point_value: 42000,    proxy: UGA,  exchange: NYM, months: FGHJKMNQUVXZ}
  HO:  {name: Heating Oil,       yahoo: "HO=F",  point_value: 42000,                 exchange: NYM, months: FGHJKMNQUVXZ}
  # Metals
  GC:  {name: Gold,              yahoo: "GC=F",  point_value: 100,      proxy: GLD,  exchange: CMX, months: GJMQVZ}
  SI:  {name: Silver,            yahoo: "SI=F",  point_value: 5000,     proxy: SLV,  exchange: CMX, months: HKNUZ}
  HG:  {name: Copper,            yahoo: "HG=F",  point_value: 25000,    proxy: CPER, exchange: CMX, months: HKNUZ}
  PL:  {name: Platinum,          yahoo: "PL=F",  point_value: 50,       proxy: PPLT, exchange: NYM, months: FJNV}
  PA:  {name: Palladium,         yahoo: "PA=F",  point_value: 100,      proxy: PALL, exchange: NYM, months: HMUZ}
  # Currencies
  6E:  {name: Euro,              yahoo: "6E=F",  point_value: 125000,   proxy: FXE,  exchange: CME, months: HMUZ}
  6J:  {name: Japanese Yen,      yahoo: "6J=F",  point_value: 12500000, proxy: FXY,  exchange: CME, months: HMUZ}
  6B:  {name: British Pound,     yahoo: "6B=F",  point_value: 62500,    proxy: FXB,  exchange: CME, months: HMUZ}
  6C:  {name: Canadian Dollar,   yahoo: "6C=F",  point_value: 100000,   proxy: FXC,  exchange: CME, months: HMUZ}
  6A:  {name: Australian Dollar, yahoo: "6A=F",  point_value: 100000,   proxy: FXA,  exchange: CME, months: HMUZ}
  6S:  {name: Swiss Franc,       yahoo: "6S=F",  point_value: 125000,   proxy: FXF,  exchange: CME, months: HMUZ}
  6M:  {name: Mexican Peso,      yahoo: "6M=F",  point_value: 500000,                exchange: CME, months: HMUZ}
  # Agriculture (grains in cents per bushel, livestock and soybean oil in cents per pound)
  ZC:  {name: Corn,              yahoo: "ZC=F",  point_value: 50,       proxy: CORN, exchange: CBT, months: HKNUZ}
  ZS:  {name: Soybeans,          yahoo: "ZS=F",  point_value: 50,       proxy: SOYB, exchange: CBT, months: FHKNQUX}
  ZW:  {name: Wheat,             yahoo: "ZW=F",  point_value: 50,       proxy: WEAT, exchange: CBT, months: HKNUZ}
  KE:  {name: KC Wheat,          yahoo: "KE=F",  point_value: 50,                    exchange: CBT, months: HKNUZ}
  ZL:  {name: Soybean Oil,       yahoo: "ZL=F",  point_value: 600,                   exchange: CBT, months: FHKNQUVZ}
  ZM:  {name: Soybean Meal,      yahoo: "ZM=F",  point_value: 100,                   exchange: CBT, months: FHKNQUVZ}
  LE:  {name: Live Cattle,       yahoo: "LE=F",  point_value: 400,                   exchange: CME, months: GJMQVZ}
  HE:  {name: Lean Hogs,         yahoo: "HE=F",  point_value: 400,                   exchange: CME, months: GJKMNQVZ}
  GF:  {name: Feeder Cattle,     yahoo: "GF=F",  point_value: 500,                   exchange: CME, months: FHJKQUVX}
